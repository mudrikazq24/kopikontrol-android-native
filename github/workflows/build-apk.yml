name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-kopikontrol-debug-keystore-v1

      - name: Create test signing key
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=KopiKontrol Debug,O=KopiKontrol,C=ID" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build installable APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KopiKontrol-Native-v2.0.0-alpha01.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KopiKontrol-APK
          path: KopiKontrol-Native-v2.0.0-alpha01.apk
          retention-days: 30
